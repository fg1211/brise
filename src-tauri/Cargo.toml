[package]
name = "brise"
version = "1.0.0"
description = "Brise — modernes DWD-Wetter für deutsche Städte"
authors = ["Brise"]
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
chrono = "0.4"
futures = "0.3"
base64 = "0.22"
flate2 = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
